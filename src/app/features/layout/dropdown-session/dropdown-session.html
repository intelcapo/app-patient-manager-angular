<div class="dropdown-session-container" (click)="toggleDropdown()">
  <img [src]="userProfileURL()" alt="User profile pic" referrerpolicy="no-referrer" />
  <span class="dropdown-session-user-data">Dr. {{ userName() }}</span>
  <span class="material-symbols-outlined dropdown-session-icon"> arrow_drop_down </span>

  @if (isOpen) {
    <div class="dropdown-menu">
      <div class="user-info">
        <p class="name">{{ userName() || 'Usuario' }}</p>
        <p class="role">Rol: Psicologo</p>
      </div>

      <hr class="divider" />

      <button class="logout-btn" (click)="onLogout()">Cerrar Sesión</button>
    </div>
  }
</div>
