<form [formGroup]="frmFilter">
  <div class="patients-filter">
    <div class="patients-filter-field">
      <app-search-input label="Filtrar por ..." formControlName="dataToSearch"></app-search-input>
    </div>
    <div class="patients-filter-field">
      <app-select-input
        label="Estado de afiliacion"
        formControlName="status"
        defaultValue="Todos"
        [options]="optionsForStatus"
      ></app-select-input>
    </div>
    <div class="patients-filter-field">
      <app-select-input
        label="Ciudad"
        formControlName="city"
        defaultValue="Todos"
        [options]="optionsForCities"
      ></app-select-input>
    </div>
  </div>
</form>
